<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapulator — Outil de Métré VRD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap');

        :root {
            --toolbar-h: 52px;
            --creator-h: 64px;
            --amber: #f59e0b;
            --amber-dk: #d97706;
            --bg: #080808;
            --surface: #0f0f0f;
            --border: #1c1c1e;
            --border2: #27272a;
            --muted: #3f3f46;
            --text: #a1a1aa;
            --white: #e4e4e7;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: 'Comfortaa', cursive;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh; width: 100vw;
            margin: 0;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; }

        #toolbar {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--toolbar-h);
            background: #0a0a0a; border-bottom: 1px solid var(--border);
            z-index: 60; display: flex; align-items: center; padding: 0 10px; gap: 2px;
        }

        /* OVERLAY — ne décale pas le workspace */
        #creatorBar {
            position: fixed; top: var(--toolbar-h); left: 0; right: 0;
            height: 0; overflow: hidden;
            background: #0c0c0c; border-bottom: 1px solid var(--border);
            z-index: 59; display: flex; align-items: center; padding: 0 16px; gap: 10px;
            transition: height 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        #creatorBar.open { height: var(--creator-h); }

        #drawer {
            position: fixed; top: var(--toolbar-h); left: 0;
            width: 300px; height: calc(100vh - var(--toolbar-h));
            background: #0a0a0a; border-right: 1px solid var(--border);
            z-index: 55; display: flex; flex-direction: column;
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 6px 0 40px rgba(0,0,0,0.8);
        }
        #drawer.open { transform: translateX(0); }

        /* Workspace FIXE — jamais décalé */
        #workspace {
            position: fixed; top: var(--toolbar-h); left: 0; right: 0; bottom: 0;
            background: #0d0d0d; touch-action: none; z-index: 10;
        }

        .tb-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 11px; border-radius: 7px;
            font-size: 0.72rem; font-weight: 700; font-family: 'Comfortaa', cursive;
            cursor: pointer; border: 1px solid transparent;
            color: var(--muted); background: transparent;
            white-space: nowrap; transition: all 0.12s; flex-shrink: 0;
        }
        .tb-btn:hover { background: #18181b; color: var(--white); border-color: var(--border2); }
        .tb-btn.active { background: #1c1400; color: #fbbf24; border-color: var(--amber-dk); }
        .tb-btn.danger:hover { background: #1f0808; color: #fca5a5; border-color: #450a0a; }
        .tb-btn.danger.active { background: #450a0a; color: #fca5a5; border-color: #dc2626; }
        .tb-sep { width:1px; height:24px; background:var(--border); margin:0 4px; flex-shrink:0; }
        .tb-label { font-size:0.58rem; color:#2d2d30; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; flex-shrink:0; }
        .tb-spacer { flex:1; min-width:0; }

        .cr-input {
            height: 32px; background: #18181b; border: 1px solid var(--border2);
            border-radius: 8px; padding: 0 11px; color: var(--white);
            font-family: 'Comfortaa', cursive; font-size: 0.78rem; font-weight: 600;
            outline: none; transition: border-color 0.15s; min-width: 0;
        }
        .cr-input:focus { border-color: var(--amber); }
        .cr-input::placeholder { color: var(--muted); }

        .cr-color {
            width: 22px; height: 22px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: all 0.12s; flex-shrink: 0;
        }
        .cr-color:hover { transform: scale(1.2); }
        .cr-color.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); transform: scale(1.2); }

        .cr-btn {
            height: 32px; padding: 0 14px; border-radius: 8px;
            font-family: 'Comfortaa', cursive; font-size: 0.73rem; font-weight: 700;
            cursor: pointer; border: 1px solid transparent; transition: all 0.12s; flex-shrink: 0;
        }
        .cr-save   { background: var(--amber-dk); color: #000; border-color: var(--amber); }
        .cr-save:hover { background: var(--amber); }
        .cr-cancel { background: #18181b; color: var(--muted); border-color: var(--border2); }
        .cr-cancel:hover { background: var(--border2); color: var(--white); }

        .cr-range {
            -webkit-appearance: none; height: 4px; border-radius: 2px;
            background: var(--border2); outline: none; cursor: pointer; width: 76px;
        }
        .cr-range::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: var(--amber); cursor: pointer;
        }

        .d-input {
            background: #18181b; border: 1px solid var(--border2); border-radius: 8px;
            padding: 7px 11px; color: var(--white) !important;
            font-family: 'Comfortaa', cursive; font-weight: 600; font-size: 0.78rem;
            outline: none; transition: border-color 0.15s;
        }
        .d-input:focus { border-color: var(--amber); }

        .tool-card {
            border: 1px solid var(--border); border-radius: 13px; padding: 11px 13px;
            cursor: pointer; transition: all 0.12s; background: var(--surface);
        }
        .tool-card:hover { border-color: var(--border2); }
        .tool-card.active { border-color: var(--amber-dk); background: #0f0a00; }

        #eraserBanner {
            position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
            background: #1f0808; border: 1px solid #7f1d1d; color: #fca5a5;
            padding: 8px 18px; border-radius: 999px; z-index: 70;
            display: none; align-items: center; gap: 14px;
            font-size: 0.77rem; font-weight: 700; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
        }

        .vrd-icon-btn {
            width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border2);
            background: #18181b; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all 0.12s; flex-shrink: 0;
        }
        .vrd-icon-btn:hover { border-color: var(--amber-dk); background: #1c1400; }
        .vrd-icon-btn.sel { border-color: var(--amber); background: #1c1400; box-shadow: 0 0 0 2px rgba(245,158,11,0.2); }

        .accord-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 11px; border-radius: 9px; cursor: pointer;
            background: #111; border: 1px solid var(--border);
            transition: all 0.12s; user-select: none;
        }
        .accord-header:hover { border-color: var(--border2); background: #161616; }
        .accord-header.open { border-color: var(--amber-dk); background: #0f0a00; }
        .accord-body { display: none; flex-direction: column; gap: 6px; padding-top: 6px; }
        .accord-body.open { display: flex; }
        .accord-chevron { transition: transform 0.18s; flex-shrink: 0; }
        .accord-chevron.open { transform: rotate(90deg); }

        .folder-block { border:1px solid #222226; border-radius:13px; overflow:visible; margin-bottom:0; transition:border-color 0.15s; position:relative; }
        .folder-block.drag-over { border-color:var(--amber-dk) !important; background:#0f0a00; }
        .folder-header { display:flex;align-items:center;gap:8px;padding:9px 12px;background:#141416;cursor:pointer;user-select:none;transition:background 0.12s;border-radius:13px; }
        .folder-header.open-body { border-radius:13px 13px 0 0; }
        .folder-header:hover { background:#1a1a1e; }
        .folder-body { padding:8px; display:flex; flex-direction:column; gap:6px; background:#141416; border-radius:0 0 13px 13px; border-top:1px solid #222226; }
        .folder-drop-zone { min-height:28px;border:1.5px dashed var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:var(--muted);transition:all 0.15s; }
        .folder-drop-zone.drag-over { border-color:var(--amber-dk);color:var(--amber);background:#0f0a00; }
        .folder-menu {
            position:absolute; right:8px; top:42px;
            background:#1a1a1e; border:1px solid var(--border2);
            border-radius:10px; padding:5px; z-index:200;
            display:flex; flex-direction:column; gap:3px;
            box-shadow:0 8px 24px rgba(0,0,0,0.7);
            min-width:130px;
        }
        .folder-menu-btn {
            display:flex; align-items:center; gap:7px;
            padding:6px 10px; border-radius:7px; border:none;
            background:transparent; color:var(--text);
            font-family:'Comfortaa',cursive; font-size:0.73rem; font-weight:700;
            cursor:pointer; transition:background 0.1s; text-align:left; width:100%;
        }
        .folder-menu-btn:hover { background:#27272a; color:#fff; }
        .folder-menu-btn.danger { color:#f87171; }
        .folder-menu-btn.danger:hover { background:#450a0a; color:#fca5a5; }
        .folder-menu-btn.confirm { color:#4ade80; }
        .folder-menu-btn.confirm:hover { background:#052e16; color:#86efac; }
        .indice-row { border-radius:8px; transition:opacity 0.15s; }
        .indice-row.dragging { opacity:0.35; }
        .indice-row[draggable=true] { cursor:grab; }

        /* Boutons outil — icône seule colorée */
        .tb-tool-btn {
            width: 36px; height: 36px; border-radius: 8px;
            border: 2px solid transparent;
            background: transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.12s; flex-shrink: 0;
            opacity: 0.5;
        }
        .tb-tool-btn:hover { background: #18181b; opacity: 1; }
        .tb-tool-btn.active { border-color: #fff; background: #18181b; opacity: 1; box-shadow: 0 0 0 1px rgba(255,255,255,0.15); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideD { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:none; } }
        .slide-d { animation: slideD 0.16s ease forwards; }
    </style>
</head>
<body>

<div id="toolbar">
    <div style="display:flex;align-items:center;gap:8px;margin-right:6px;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <polygon points="12,2 22,8 22,16 12,22 2,16 2,8" fill="#d97706" opacity="0.12" stroke="#d97706" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="2.8" fill="#f59e0b"/>
            <line x1="12" y1="5" x2="12" y2="9.2" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="14.8" x2="12" y2="19" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5" y1="8.5" x2="8.6" y2="10.6" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15.4" y1="13.4" x2="19" y2="15.5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="5" y1="15.5" x2="8.6" y2="13.4" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="15.4" y1="10.6" x2="19" y2="8.5" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span style="color:#fff;font-weight:700;font-size:0.82rem;letter-spacing:0.06em;">MAPULATOR</span>
    </div>
    <div class="tb-sep"></div>
    <!-- SETUP / ITEM : interrupteur -->
    <div style="display:flex;background:#18181b;border:1px solid var(--border2);border-radius:8px;padding:2px;gap:2px;flex-shrink:0;">
        <button id="tb-SETUP" onclick="toggleTab('SETUP')" class="tb-btn" style="padding:5px 10px;border-radius:6px;gap:5px;" title="Setup">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
            <span style="font-size:0.7rem;">Setup</span>
        </button>
        <button id="tb-ITEM" onclick="toggleTab('ITEM')" class="tb-btn" style="padding:5px 10px;border-radius:6px;gap:5px;" title="Items">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span style="font-size:0.7rem;">Items</span>
        </button>
    </div>
    <div class="tb-sep"></div>
    <!-- Outils — icône seule, colorée -->
    <button id="tb-VRD" onclick="toggleTab('VRD')" class="tb-tool-btn" title="VRD — Linéaires">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round">
            <path d="M3 12h18"/><circle cx="3" cy="12" r="2" fill="#60a5fa" stroke="none"/><circle cx="12" cy="12" r="2" fill="#60a5fa" stroke="none"/><circle cx="21" cy="12" r="2" fill="#60a5fa" stroke="none"/>
        </svg>
    </button>
    <button id="tb-TRANCHEE" onclick="toggleTab('TRANCHEE')" class="tb-tool-btn" title="Tranchée — Volumes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round">
            <rect x="2" y="8" width="20" height="8" rx="2" fill="#fb923c" opacity="0.22"/><rect x="2" y="8" width="20" height="8" rx="2"/>
            <line x1="7" y1="8" x2="7" y2="16"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="17" y1="8" x2="17" y2="16"/>
        </svg>
    </button>
    <button id="tb-AREA" onclick="toggleTab('AREA')" class="tb-tool-btn" title="Surfaces">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round">
            <polygon points="3,19 12,3 21,19" fill="#4ade80" opacity="0.2"/><polygon points="3,19 12,3 21,19"/>
            <circle cx="3" cy="19" r="2" fill="#4ade80" stroke="none"/><circle cx="12" cy="3" r="2" fill="#4ade80" stroke="none"/><circle cx="21" cy="19" r="2" fill="#4ade80" stroke="none"/>
        </svg>
    </button>
    <button id="tb-TERRASSEMENT" onclick="toggleTab('TERRASSEMENT')" class="tb-tool-btn" title="Terrassement — Volumes de surface">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <!-- Face du dessus -->
            <polygon points="12,3 21,7.5 12,12 3,7.5" fill="#a78bfa" opacity="0.25"/>
            <polygon points="12,3 21,7.5 12,12 3,7.5"/>
            <!-- Face gauche -->
            <polygon points="3,7.5 12,12 12,21 3,16.5" fill="#a78bfa" opacity="0.12"/>
            <polygon points="3,7.5 12,12 12,21 3,16.5"/>
            <!-- Face droite -->
            <polygon points="21,7.5 12,12 12,21 21,16.5" fill="#a78bfa" opacity="0.18"/>
            <polygon points="21,7.5 12,12 12,21 21,16.5"/>
        </svg>
    </button>
    <button id="tb-POINT" onclick="toggleTab('POINT')" class="tb-tool-btn" title="Pointage VRD">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f472b6" stroke-width="2" stroke-linecap="round">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#f472b6" opacity="0.2"/>
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5" fill="#f472b6" opacity="0.8"/>
        </svg>
    </button>
    <div class="tb-sep"></div>
    <button id="tb-SUMMARY" onclick="toggleTab('SUMMARY')" class="tb-btn" title="Imprimer le récap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        <span style="font-size:0.7rem;">Print</span>
    </button>
    <div class="tb-spacer"></div>
    <button id="tb-eraser" onclick="toggleEraser()" class="tb-btn danger">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M20 20H7L3 16l10-10 7 7-3.5 3.5"/><path d="M6 11l7 7"/>
        </svg>
        Gomme
    </button>
    <div class="tb-sep"></div>
    <button onclick="handleButtonZoom(1.2)" class="tb-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button onclick="handleButtonZoom(1/1.2)" class="tb-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
    <button onclick="toggleFullScreen()" id="btn-fs" class="tb-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
</div>

<div id="creatorBar"></div>

<div id="drawer">
    <div style="padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--surface);">
        <span id="drawerTitle" style="color:#fff;font-weight:700;font-size:0.82rem;"></span>
        <button onclick="closeDrawer()" style="color:var(--muted);background:none;border:none;cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:5px;font-family:inherit;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--muted)'">✕</button>
    </div>
    <div id="drawerContent" style="padding:13px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;"></div>
</div>

<div id="workspace">
    <div id="emptyState" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#27272a;font-size:0.82rem;pointer-events:none;">
        Ouvrez <span style="color:var(--amber-dk);margin:0 5px;font-weight:700;">Setup</span> pour importer un plan
    </div>
    <div id="loader" style="display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.88);z-index:80;backdrop-filter:blur(4px);">
        <div style="font-size:2.2rem;animation:spin 0.9s linear infinite;">⚙️</div>
        <div style="color:#fff;font-weight:700;margin-top:10px;font-size:0.9rem;">Traitement…</div>
    </div>
    <div id="canvasContainer" style="display:none;position:absolute;transform-origin:top left;border:1px solid var(--border);">
        <canvas id="drawCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;"></canvas>
    </div>
    <canvas id="printCanvas" style="display:none;"></canvas>
</div>

<div id="eraserBanner">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16l10-10 7 7-3.5 3.5"/><path d="M6 11l7 7"/></svg>
    Mode Gomme — cliquez une forme pour effacer
    <button onclick="toggleEraser()" style="background:#fca5a5;color:#450a0a;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:999px;border:none;cursor:pointer;font-family:inherit;">Désactiver</button>
</div>

<script>

    scaleRatioInput: '50',

    superpositionClick1: null,

const ctx = els.drawCanvas.getContext('2d');

function setState(upd) { Object.assign(state, upd); renderDOM(); drawCanvas(); }

function renderDOM() {
    const hasPlan = state.plans && state.plans.length > 0;
    els.loader.style.display     = state.isLoading ? 'flex' : 'none';
    els.emptyState.style.display = (!hasPlan && !state.isLoading) ? 'flex' : 'none';

    if (hasPlan) {
        els.canvasContainer.style.display = 'block';
        els.canvasContainer.style.transform = `translate(${state.transform.x}px,${state.transform.y}px) scale(${state.transform.scale})`;
        els.canvasContainer.querySelectorAll('img.plan-layer').forEach(el=>el.remove());

        const ref = state.plans[0];
        // Calculer le bounding box union de tous les plans
        let minX=0, minY=0, maxX=0, maxY=0;
        state.plans.forEach((plan, i) => {
            const sc = (i===0) ? 1 : computePlanScale(plan, ref);
            const bb = planBBox(plan, sc);
            minX = Math.min(minX, bb.x);
            minY = Math.min(minY, bb.y);
            maxX = Math.max(maxX, bb.x + bb.w);
            maxY = Math.max(maxY, bb.y + bb.h);
        });
        // Si des offsets négatifs existent, décaler tous les plans
        const shiftX = Math.min(0, minX);
        const shiftY = Math.min(0, minY);
        const cW = Math.max(maxX - shiftX, state.imageSize.w);
        const cH = Math.max(maxY - shiftY, state.imageSize.h);
        els.canvasContainer.style.width  = cW + 'px';
        els.canvasContainer.style.height = cH + 'px';
        els.drawCanvas.width  = cW;
        els.drawCanvas.height = cH;

        // Construire les couches avec transform correct
        state.plans.forEach((plan, i) => {
            const sc = (i===0) ? 1 : computePlanScale(plan, ref);
            const img = document.createElement('img');
            img.className = 'plan-layer';
            img.src = plan.src;
            // Appliquer le shift pour les offsets négatifs
            const adjustedPlan = { ...plan, offsetX: (plan.offsetX||0) - shiftX, offsetY: (plan.offsetY||0) - shiftY };
            img.style.cssText = `position:absolute;top:0;left:0;width:${plan.w}px;height:${plan.h}px;pointer-events:none;display:block;opacity:${plan.opacity??1};z-index:${i+1};transform-origin:top left;transform:${planCssTransform(adjustedPlan, sc)};`;
            els.canvasContainer.insertBefore(img, els.drawCanvas);
        });
        els.drawCanvas.style.zIndex = state.plans.length + 1;
        // Curseur
        const isSuperMode = state.superpositionMode;
        const at = state.tools.find(t=>t.id===state.activeToolId);
        const drawMode = state.pixelsPerMeter && at && ['VRD','TRANCHEE','AREA','TERRASSEMENT','POINT'].includes(at.type);
        els.drawCanvas.style.cursor = state.isPanning ? 'grabbing' : (isSuperMode ? 'cell' : (state.isEraserMode||drawMode ? 'crosshair' : 'grab'));
    } else {
        els.canvasContainer.style.display = 'none';
    }

    els.eraserBanner.style.display = state.isEraserMode ? 'flex' : 'none';
    els.drawer.classList.toggle('open', !!(state.isDrawerOpen && state.activeTab));
    els.creatorBar.classList.toggle('open', state.isCreatorOpen);
    if (state.isCreatorOpen) renderCreatorBar();
    else els.creatorBar.innerHTML = '';

    renderToolbarStates();
    renderDrawerContent();
}

function selectCreatorColor(hex) {
    state.creatorData.color = hex;
    renderCreatorBar();
}
function selectVrdIcon(key) {
    state.creatorData.vrdIcon = key;
    document.querySelectorAll('.vrd-icon-btn').forEach(b=>b.classList.remove('sel'));
    [...document.querySelectorAll('.vrd-icon-btn')].find(b=>b.title===VRD_ICONS[key].label)?.classList.add('sel');
}
function handleCreatorKey(e) { e.stopPropagation(); if(e.key==='Enter') saveTool(); if(e.key==='Escape') cancelCreator(); }
function openCreator(mode, toolId=null, forceType=null) {
    let d={ name:'', color:COLORS[4], thickness:20, pointSize:12, indice:'', editingId:null, vrdIcon:'regard', trancheeW:'0.80', trancheeD:'1.20', terrZ:'1.00', terrType:'deblais' };
    if(mode==='edit'&&toolId){ const t=state.tools.find(x=>x.id===toolId); if(t) d={name:t.name,color:t.color,thickness:t.thickness||20,pointSize:t.pointSize||12,indice:t.indice||'',editingId:t.id,vrdIcon:t.vrdIcon||'regard',trancheeW:String(t.trancheeW||'0.80'),trancheeD:String(t.trancheeD||'1.20'),terrZ:String(t.terrZ||'1.00'),terrType:t.terrType||'deblais'}; }
    // type effectif : forcé > outil édité > onglet actif
    const effectiveType = forceType || (d.editingId ? state.tools.find(t=>t.id===d.editingId)?.type : null) || state.activeTab;
    d.effectiveType = effectiveType;
    setState({ activeTab:'ITEM', isDrawerOpen:true, isCreatorOpen:true, creatorMode:mode, creatorData:d });
}
function cancelCreator() { setState({ isCreatorOpen:false, creatorMode:null }); }
function saveTool() {
    const nameEl=document.getElementById('cr-name');
    const indiceEl=document.getElementById('cr-indice');
    const name=(nameEl?nameEl.value:state.creatorData.name).trim();
    if(!name){ if(nameEl) nameEl.focus(); return; }
    const d=state.creatorData;
    const indice=(indiceEl?indiceEl.value:d.indice||'').trim().toUpperCase();
    const effectiveType = d.effectiveType || state.activeTab;
    const existing=d.editingId?state.tools.find(t=>t.id===d.editingId):null;
    const newTool={ id:d.editingId||Date.now().toString(), name,
        type: d.editingId ? existing.type : effectiveType,
        color:d.color, thickness:+d.thickness, pointSize:+(d.pointSize||12), vrdIcon:d.vrdIcon,
        indice,
        trancheeW:parseFloat(d.trancheeW)||0.8, trancheeD:parseFloat(d.trancheeD)||1.2,
        terrZ:parseFloat(d.terrZ)||1.0,
        terrType:d.terrType||'deblais',
        hidden: existing ? existing.hidden : false,
        measurements:existing?existing.measurements:[] };
    const newTools=[...state.tools]; const idx=newTools.findIndex(t=>t.id===newTool.id);
    if(idx>=0) newTools[idx]=newTool; else newTools.push(newTool);
    setState({ tools:newTools, activeToolId:newTool.id, isCreatorOpen:false, creatorMode:null });
}

function renderToolbarStates() {
    const activeTool = state.tools.find(t=>t.id===state.activeToolId);
    const activeToolType = activeTool?.type || null;

    // Interrupteur SETUP / ITEM
    ['SETUP','ITEM'].forEach(t=>{
        const btn=document.getElementById('tb-'+t); if(!btn) return;
        const isActive = state.activeTab===t && state.isDrawerOpen;
        btn.style.background = isActive ? '#292929' : 'transparent';
        btn.style.color = isActive ? '#fff' : '';
        btn.style.borderColor = 'transparent';
        const lock = t==='ITEM' && !state.pixelsPerMeter;
        btn.style.opacity = lock ? '0.3' : '1';
        btn.style.pointerEvents = lock ? 'none' : 'auto';
        btn.className = isActive ? 'tb-btn active' : 'tb-btn';
    });

    // Boutons outils — classe tb-tool-btn, actif = outil actif de dessin
    ['VRD','TRANCHEE','AREA','TERRASSEMENT','POINT'].forEach(t=>{
        const btn=document.getElementById('tb-'+t); if(!btn) return;
        const isActive = activeToolType===t;
        btn.className = isActive ? 'tb-tool-btn active' : 'tb-tool-btn';
        btn.style.opacity = state.pixelsPerMeter ? (isActive?'1':'0.6') : '0.2';
        btn.style.pointerEvents = state.pixelsPerMeter ? 'auto' : 'none';
    });

    // Print — action pure, jamais actif
    const ps=document.getElementById('tb-SUMMARY');
    if(ps){ ps.className='tb-btn'; ps.style.opacity=state.pixelsPerMeter?'1':'0.3'; ps.style.pointerEvents=state.pixelsPerMeter?'auto':'none'; }

    // Gomme
    const eb=document.getElementById('tb-eraser');
    if(eb) eb.className=state.isEraserMode?'tb-btn danger active':'tb-btn danger';
}

function renderDrawerContent() {
    if(!state.activeTab) return;
    const titles={SETUP:'Setup', ITEM:'Items'};
    els.drawerTitle.textContent=titles[state.activeTab]||'';
    let html='';
    if(state.activeTab==='SETUP') html=buildSetup();
    else if(state.activeTab==='ITEM') html=buildItemTab();
    els.drawerContent.innerHTML = html;
    const fi = document.getElementById('folder-name-input');
    if (fi) setTimeout(()=>fi.focus(), 30);
    const rf = document.getElementById('rename-folder-input');
    if (rf) setTimeout(()=>{rf.focus();rf.select();}, 30);
    const ri = document.getElementById('rename-indice-input');
    if (ri) setTimeout(()=>{ri.focus();ri.select();}, 30);
}

function buildItemTab() {
    if (!state.folders) state.folders = [];
    if (!state.folderOpen) state.folderOpen = {};
    if (!state.accordOpen) state.accordOpen = {};

    // Grouper outils par indice
    const groups = {};
    state.tools.forEach(t => {
        const key = t.indice && t.indice.trim() ? t.indice.trim().toUpperCase() : '__DIVERS__';
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
    });
    const TYPE_ORDER_ACCORD = {VRD:0, AREA:1, TRANCHEE:2, TERRASSEMENT:3, POINT:4};
    Object.keys(groups).forEach(k=>{
        groups[k]=groups[k].slice().sort((a,b)=>(TYPE_ORDER_ACCORD[a.type]??9)-(TYPE_ORDER_ACCORD[b.type]??9));
    });

    // Indices déjà dans un dossier
    const inFolder = new Set(state.folders.flatMap(f=>f.indiceKeys||[]));

    // Indices libres (pas dans un dossier), triés
    const allIndices = Object.keys(groups).filter(k=>k!=='__DIVERS__').sort();
    const freeIndices = allIndices.filter(k=>!inFolder.has(k));
    if (groups['__DIVERS__'] && !inFolder.has('__DIVERS__')) freeIndices.push('__DIVERS__');

    const noTools = state.tools.length === 0;

    // ─── Bouton / formulaire créer dossier ───
    const folderBtn = state.isCreatingFolder ? `
    <div style="display:flex;gap:6px;align-items:center;background:#141416;border:1px solid var(--amber-dk);border-radius:9px;padding:6px 10px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <input id="folder-name-input" class="cr-input" style="flex:1;height:28px;font-size:0.75rem;" placeholder="Nom du dossier…"
               onkeydown="if(event.key==='Enter'){event.stopPropagation();confirmCreateFolder();}if(event.key==='Escape')setState({isCreatingFolder:false});"
               oninput="event.stopPropagation()" />
        <button onclick="confirmCreateFolder()" style="background:var(--amber-dk);color:#000;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:700;font-size:0.72rem;font-family:inherit;">OK</button>
        <button onclick="setState({isCreatingFolder:false})" style="background:#18181b;color:var(--muted);border:1px solid var(--border2);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:0.72rem;font-family:inherit;">✕</button>
    </div>` : `
    <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:0.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;">Structure</span>
        <button onclick="createFolder()" style="background:none;border:1px solid var(--border2);border-radius:7px;padding:3px 8px;cursor:pointer;color:var(--muted);font-size:0.72rem;font-family:inherit;display:flex;align-items:center;gap:4px;transition:all 0.12s;" onmouseover="this.style.borderColor='var(--amber-dk)';this.style.color='var(--amber)'" onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--muted)'">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
            Dossier
        </button>
    </div>`;

    let html = `<div style="display:flex;flex-direction:column;gap:8px;">${folderBtn}`;

    if (noTools && !state.folders.length) {
        html += `<p style="font-size:0.7rem;color:var(--border2);text-transform:uppercase;letter-spacing:0.07em;text-align:center;padding:24px 0;">Aucun outil créé</p>`;
    }

    // ─── Dossiers ───
    state.folders.forEach(folder => {
        const isOpen = state.folderOpen[folder.id] !== false;
        const folderIndices = (folder.indiceKeys||[]).filter(k=>groups[k]);
        const chevron = `<svg style="transition:transform 0.18s;transform:${isOpen?'rotate(90deg)':'none'};flex-shrink:0;" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>`;

        const isMenuOpen = state.renamingFolder && state.renamingFolder.id === folder.id;
        const folderTools = folderIndices.flatMap(k => groups[k] || []);
        const folderAllHidden = folderTools.length > 0 && folderTools.every(t => t.hidden);
        const folderNameHtml = isMenuOpen
            ? `<input id="rename-folder-input" class="cr-input" style="flex:1;height:24px;font-size:0.75rem;min-width:0;"
                   value="${folder.name}"
                   onkeydown="if(event.key==='Enter'){event.stopPropagation();confirmRenameFolder();}if(event.key==='Escape')setState({renamingFolder:null});"
                   oninput="event.stopPropagation()" onclick="event.stopPropagation()" />`
            : `<span style="flex:1;font-weight:700;font-size:0.78rem;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${folder.name}</span>`;

        const folderMenu = isMenuOpen ? `
            <div class="folder-menu" onclick="event.stopPropagation()">
                <button class="folder-menu-btn confirm" onclick="event.stopPropagation();confirmRenameFolder()">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                    Valider
                </button>
                <button class="folder-menu-btn" onclick="event.stopPropagation();printFolder('${folder.id}');setState({renamingFolder:null})">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Imprimer
                </button>
                <button class="folder-menu-btn danger" onclick="event.stopPropagation();deleteFolder('${folder.id}')">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
                    Supprimer
                </button>
            </div>` : '';

        html += `
        <div class="folder-block" id="folder-${folder.id}"
             ondragover="event.preventDefault();document.getElementById('folder-${folder.id}').classList.add('drag-over')"
             ondragleave="document.getElementById('folder-${folder.id}').classList.remove('drag-over')"
             ondrop="dropOnFolder(event,'${folder.id}')">
            <div class="folder-header ${isOpen?'open-body':''}" onclick="${isMenuOpen?'':` toggleFolder('${folder.id}')`}">
                ${chevron}
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" style="flex-shrink:0;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                ${folderNameHtml}
                <span style="font-size:0.6rem;color:var(--muted);background:var(--border2);padding:1px 5px;border-radius:4px;flex-shrink:0;">${folderIndices.length}</span>
                <button onclick="event.stopPropagation();toggleFolderVisibility('${folder.id}')" title="${folderAllHidden?'Afficher':'Masquer'}" style="background:none;border:none;cursor:pointer;color:${folderAllHidden?'var(--amber)':'var(--muted)'};padding:2px;border-radius:4px;display:flex;align-items:center;flex-shrink:0;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='${folderAllHidden?'var(--amber)':'var(--muted)'}'">
                    ${folderAllHidden
                        ? `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                        : `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`}
                </button>
                <button onclick="event.stopPropagation();renameFolderUI('${folder.id}')" title="Modifier" style="background:${isMenuOpen?'#27272a':'none'};border:1px solid ${isMenuOpen?'var(--amber-dk)':'transparent'};cursor:pointer;color:${isMenuOpen?'var(--amber)':'var(--muted)'};padding:3px 5px;border-radius:5px;display:flex;align-items:center;flex-shrink:0;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='${isMenuOpen?'var(--amber)':'var(--muted)'}'">
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
            </div>
            ${folderMenu}
            ${isOpen ? `<div class="folder-body">
                ${folderIndices.length ? folderIndices.map(k=>buildIndiceRow(k, groups[k], folder.id)).join('') : ''}
                <div class="folder-drop-zone" id="fdz-${folder.id}"
                     ondragover="event.preventDefault();document.getElementById('fdz-${folder.id}').classList.add('drag-over')"
                     ondragleave="document.getElementById('fdz-${folder.id}').classList.remove('drag-over')"
                     ondrop="dropOnFolder(event,'${folder.id}')">
                    Déposer un indice ici
                </div>
            </div>` : ''}
        </div>`;
    });

    // ─── Indices libres (hors dossier) ───
    if (freeIndices.length) {
        html += `<div style="display:flex;flex-direction:column;gap:6px;" id="free-indices"
            ondragover="event.preventDefault();document.getElementById('free-indices').style.outline='1px dashed var(--amber-dk)'"
            ondragleave="document.getElementById('free-indices').style.outline=''"
            ondrop="dropOnFree(event)">`;
        freeIndices.forEach(k => { html += buildIndiceRow(k, groups[k], null); });
        html += `</div>`;
    }

    html += `</div>`;
    return html;
}

function buildIndiceRow(key, tools, folderId) {
    const label = key === '__DIVERS__' ? 'Divers' : key;
    const isOpen = state.accordOpen[key] !== false;
    const allHidden = tools.every(t=>t.hidden);
    const isRenamingThis = state.renamingIndice && state.renamingIndice.key === key;
    const chevron = `<svg class="accord-chevron ${isOpen?'open':''}" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>`;
    const eyeIcon = allHidden
        ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const dragHandle = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="cursor:grab;flex-shrink:0;color:var(--muted);"><circle cx="9" cy="7" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="17" r="1" fill="currentColor"/><circle cx="15" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="17" r="1" fill="currentColor"/></svg>`;

    const nameHtml = isRenamingThis ? `
        <input id="rename-indice-input" class="cr-input" style="flex:1;height:22px;font-size:0.73rem;"
               value="${label}"
               onkeydown="if(event.key==='Enter'){event.stopPropagation();confirmRenameIndice();}if(event.key==='Escape')setState({renamingIndice:null});"
               oninput="event.stopPropagation()" onclick="event.stopPropagation()" />
        <button onclick="event.stopPropagation();confirmRenameIndice()" style="background:var(--amber-dk);color:#000;border:none;border-radius:5px;padding:1px 7px;cursor:pointer;font-weight:700;font-size:0.68rem;font-family:inherit;flex-shrink:0;">OK</button>`
        : `<span style="font-weight:700;font-size:0.78rem;color:${isOpen?'#fff':'var(--text)'}">${label}</span>
           <span style="font-size:0.6rem;color:var(--muted);background:var(--border2);padding:1px 5px;border-radius:4px;">${tools.length}</span>`;

    const renameBtn = key !== '__DIVERS__' && !isRenamingThis ? `
        <button onclick="event.stopPropagation();renameIndiceUI('${key}')" title="Renommer l'indice" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:2px 4px;border-radius:4px;display:flex;align-items:center;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='var(--muted)'">
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>` : '';

    return `
    <div class="indice-row" draggable="${!isRenamingThis}"
         ondragstart="${isRenamingThis?'event.preventDefault()':` dragIndice(event,'${key}','${folderId||''}')`}"
         ondragend="this.classList.remove('dragging')">
        <div class="accord-header ${isOpen?'open':''}" onclick="${isRenamingThis?'':` toggleAccord('${key}')`}" style="gap:6px;">
            <div style="display:flex;align-items:center;gap:6px;flex:1;min-width:0;">
                ${dragHandle}
                ${!isRenamingThis ? chevron : ''}
                ${nameHtml}
            </div>
            <div style="display:flex;align-items:center;gap:2px;flex-shrink:0;">
                ${renameBtn}
                <button onclick="event.stopPropagation();toggleIndiceVisibility('${key}')" style="background:none;border:none;cursor:pointer;color:${allHidden?'var(--amber)':'var(--muted)'};padding:3px;border-radius:5px;display:flex;align-items:center;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='${allHidden?'var(--amber)':'var(--muted)'}'">
                    ${eyeIcon}
                </button>
            </div>
        </div>
        <div class="accord-body ${isOpen?'open':''}">
            ${tools.map(tool=>buildToolCard(tool)).join('')}
        </div>
    </div>`;
}

// ─── DOSSIERS ───
function confirmCreateFolder() {
    const el = document.getElementById('folder-name-input');
    const name = el ? el.value.trim() : '';
    if (!name) return;
    const newFolder = { id: Date.now().toString(), name, indiceKeys: [] };
    setState({ folders: [...(state.folders||[]), newFolder], isCreatingFolder: false });
}

function createFolder() {
    setState({ isCreatingFolder: true });
}

function toggleFolder(id) {
    if (!state.folderOpen) state.folderOpen = {};
    state.folderOpen[id] = state.folderOpen[id] === false ? true : false;
    renderDrawerContent();
}

function toggleFolderVisibility(folderId) {
    const folder = state.folders.find(f=>f.id===folderId);
    if (!folder) return;
    const folderIndices = new Set(folder.indiceKeys||[]);
    const folderTools = state.tools.filter(t=>{
        const k = t.indice&&t.indice.trim() ? t.indice.trim().toUpperCase() : '__DIVERS__';
        return folderIndices.has(k);
    });
    const allHidden = folderTools.every(t=>t.hidden);
    const ids = new Set(folderTools.map(t=>t.id));
    const newTools = state.tools.map(t => ids.has(t.id) ? {...t, hidden:!allHidden} : t);
    setState({tools: newTools});
}

function deleteFolder(id) {
    if (!confirm("Supprimer ce dossier ? Les indices retournent à la racine.")) return;
    setState({ folders: state.folders.filter(f=>f.id!==id) });
}

function renameFolderUI(id) {
    setState({ renamingFolder: { id } });
}
function renameIndiceUI(key) {
    setState({ renamingIndice: { key } });
}
function confirmRenameIndice() {
    const el = document.getElementById('rename-indice-input');
    const newName = el ? el.value.trim().toUpperCase() : '';
    if (!newName || !state.renamingIndice) { setState({ renamingIndice: null }); return; }
    const oldKey = state.renamingIndice.key;
    if (newName === oldKey) { setState({ renamingIndice: null }); return; }
    // Renommer l'indice dans tous les outils
    const newTools = state.tools.map(t=>{
        const tKey = t.indice&&t.indice.trim() ? t.indice.trim().toUpperCase() : '__DIVERS__';
        return tKey===oldKey ? {...t, indice: newName==='__DIVERS__' ? '' : newName} : t;
    });
    // Renommer dans les dossiers
    const newFolders = state.folders.map(f=>({...f, indiceKeys: f.indiceKeys.map(k=>k===oldKey?newName:k)}));
    // Mettre à jour accordOpen
    if (state.accordOpen && state.accordOpen[oldKey] !== undefined) {
        state.accordOpen[newName] = state.accordOpen[oldKey];
        delete state.accordOpen[oldKey];
    }
    setState({ tools: newTools, folders: newFolders, renamingIndice: null });
}

function confirmRenameFolder() {
    const el = document.getElementById('rename-folder-input');
    const name = el ? el.value.trim() : '';
    if (!name || !state.renamingFolder) { setState({ renamingFolder: null }); return; }
    setState({ folders: state.folders.map(f=>f.id===state.renamingFolder.id?{...f,name}:f), renamingFolder: null });
}

// ─── DRAG & DROP ───
let _dragging = null; // {key, fromFolderId}

function dragIndice(event, key, fromFolderId) {
    _dragging = { key, fromFolderId: fromFolderId || null };
    event.dataTransfer.effectAllowed = 'move';
    event.target.classList.add('dragging');
}

function dropOnFolder(event, toFolderId) {
    event.preventDefault();
    document.querySelectorAll('.folder-block,.folder-drop-zone').forEach(el=>el.classList.remove('drag-over'));
    if (!_dragging) return;
    const { key, fromFolderId } = _dragging;
    _dragging = null;
    if (fromFolderId === toFolderId) return;
    const newFolders = state.folders.map(f=>{
        if (f.id === fromFolderId) return {...f, indiceKeys: f.indiceKeys.filter(k=>k!==key)};
        if (f.id === toFolderId)   return {...f, indiceKeys: [...(f.indiceKeys||[]), key]};
        return f;
    });
    setState({ folders: newFolders });
}

function dropOnFree(event) {
    event.preventDefault();
    document.getElementById('free-indices') && (document.getElementById('free-indices').style.outline='');
    if (!_dragging || !_dragging.fromFolderId) { _dragging=null; return; }
    const { key, fromFolderId } = _dragging; _dragging=null;
    const newFolders = state.folders.map(f=>
        f.id===fromFolderId ? {...f, indiceKeys: f.indiceKeys.filter(k=>k!==key)} : f
    );
    setState({ folders: newFolders });
}

// ─── PRINT DOSSIER ───
async function printFolder(folderId) {
    const folder = state.folders.find(f=>f.id===folderId);
    if (!folder) return;
    const folderIndices = new Set(folder.indiceKeys);
    // Filtrer les outils du dossier
    const filteredTools = state.tools.filter(t=>{
        const key = t.indice&&t.indice.trim() ? t.indice.trim().toUpperCase() : '__DIVERS__';
        return folderIndices.has(key);
    });
    if (!filteredTools.length) return alert("Ce dossier ne contient aucun outil.");
    await generatePrintImageForTools(filteredTools, folder.name);
}

function toggleAccord(key) {
    if (!state.accordOpen) state.accordOpen = {};
    state.accordOpen[key] = state.accordOpen[key] === false ? true : false;
    renderDrawerContent();
}
function toggleIndiceVisibility(key) {
    const realKey = key === '__DIVERS__' ? '' : key;
    const tools = state.tools.filter(t=>(t.indice||'').toUpperCase()===(realKey||'').toUpperCase()||(realKey===''&&!t.indice));
    const allHidden = tools.every(t=>t.hidden);
    const newTools = state.tools.map(t=>{
        const match = realKey==='' ? (!t.indice||t.indice.trim()==='') : (t.indice||'').toUpperCase()===realKey.toUpperCase();
        return match ? {...t, hidden:!allHidden} : t;
    });
    setState({tools:newTools});
}

function buildToolCard(tool) {
    const isActive = state.activeToolId===tool.id;
    const isTr=tool.type==='TRANCHEE', isPt=tool.type==='POINT', isAr=tool.type==='AREA', isTerr=tool.type==='TERRASSEMENT';
    const isHidden=!!tool.hidden;
    const len=tool.measurements.reduce((a,p)=>a+calculateLength(p,isAr||isTr||isTerr),0);
    const area=(isAr||isTerr)?tool.measurements.reduce((a,p)=>a+calculateArea(p),0):0;
    const vol=isTr?len*(tool.trancheeW||0.8)*(tool.trancheeD||1.2) : isTerr?area*(tool.terrZ||1):0;
    const sz=tool.pointSize||12;
    const typeLabel={VRD:'VRD',TRANCHEE:'Tranchée',AREA:'Surface',TERRASSEMENT:'Terrassement',POINT:'Pointage'}[tool.type]||'';
    const preview=isPt
        ?`<div style="color:${isHidden?'var(--muted)':tool.color};opacity:${isHidden?0.35:1};">${VRD_ICONS[tool.vrdIcon||'regard'].svg}</div>`
        :`<div style="width:18px;height:${Math.max(isTr?(tool.thickness||20)/4:2,2)}px;border-radius:2px;background:${tool.color};opacity:${isHidden?0.2:isTr?0.5:1};flex-shrink:0;"></div>`;
    const eyeBtn=`<button onclick="event.stopPropagation();toggleToolVisibility('${tool.id}')" style="background:#18181b;border:1px solid var(--border2);border-radius:5px;padding:2px 5px;cursor:pointer;color:${isHidden?'var(--amber)':'var(--muted)'};transition:all 0.1s;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='${isHidden?'var(--amber)':'var(--muted)'}'">
        ${isHidden?`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`}
    </button>`;
    return `<div class="tool-card ${isActive?'active':''}" style="${isHidden?'opacity:0.5;':''}" onclick="setActiveTool('${tool.id}')">
        <div style="display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
                ${preview}
                <div style="min-width:0;">
                    <div style="font-weight:700;font-size:0.76rem;color:${isActive?'#fff':'var(--text)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${tool.name}</div>
                    <div style="font-size:0.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;">${typeLabel}</div>
                </div>
            </div>
            <div style="display:flex;align-items:center;gap:3px;flex-shrink:0;margin-left:6px;">
                <div style="text-align:right;margin-right:4px;line-height:1.2;">
                    ${isTr?`<div style="font-family:monospace;font-size:0.68rem;font-weight:700;color:var(--amber);">${vol.toFixed(2)} m³</div>`:''}
                    ${isAr?`<div style="font-family:monospace;font-size:0.68rem;font-weight:700;color:var(--amber);">${area.toFixed(2)} m²</div>`:''}
                    ${isTerr?`<div style="font-family:monospace;font-size:0.68rem;font-weight:700;color:var(--amber);">${tool.terrType==='remblais'?'+':'-'}${vol.toFixed(2)} m³</div><div style="font-size:0.58rem;font-weight:700;color:${tool.terrType==='remblais'?'#fdba74':'#93c5fd'};">${tool.terrType==='remblais'?'▲':'▼'} ${tool.terrType==='remblais'?'Remblais':'Déblais'}</div>`:''}
                    ${tool.type==='VRD'?`<div style="font-family:monospace;font-size:0.68rem;font-weight:700;color:var(--amber);">${len.toFixed(2)} ml</div>`:''}
                    ${isPt?`<div style="font-family:monospace;font-size:0.68rem;font-weight:700;color:var(--amber);">${tool.measurements.length} u</div>`:''}
                </div>
                ${eyeBtn}
                <button onclick="event.stopPropagation();openCreator('edit','${tool.id}')" style="background:#18181b;border:1px solid var(--border2);border-radius:5px;padding:2px 5px;cursor:pointer;color:var(--muted);transition:all 0.1s;" onmouseover="this.style.color='#fff';this.style.background='var(--border2)'" onmouseout="this.style.color='var(--muted)';this.style.background='#18181b'"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                <button onclick="event.stopPropagation();deleteTool('${tool.id}')" style="background:#18181b;border:1px solid var(--border2);border-radius:5px;padding:2px 5px;cursor:pointer;color:var(--muted);transition:all 0.1s;" onmouseover="this.style.color='#ef4444';this.style.borderColor='#450a0a';this.style.background='#1f0808'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border2)';this.style.background='#18181b'"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
            </div>
        </div>
        ${state.pendingDeleteTool===tool.id ? `
        <div onclick="event.stopPropagation()" style="margin-top:8px;padding:8px 10px;background:#1f0808;border:1px solid #450a0a;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <span style="font-size:0.68rem;color:#fca5a5;">Supprimer cet outil ?</span>
            <div style="display:flex;gap:5px;">
                <button onclick="event.stopPropagation();confirmDeleteTool()" style="background:#dc2626;color:#fff;border:none;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:0.68rem;font-weight:700;font-family:inherit;">Oui</button>
                <button onclick="event.stopPropagation();cancelDeleteTool()" style="background:#27272a;color:var(--muted);border:none;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:0.68rem;font-family:inherit;">Non</button>
            </div>
        </div>` : ''}
    </div>`;
}

function buildSetup(){
