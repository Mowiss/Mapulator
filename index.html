function buildToolList(type){
    const tools=state.tools.filter(t=>t.type===type);
    if(!tools.length) return`<p style="font-size:0.7rem;color:var(--border2);text-transform:uppercase;letter-spacing:0.07em;text-align:center;padding:18px 0;">Aucun outil</p>`;
    return`<div style="display:flex;flex-direction:column;gap:7px;" class="slide-d">`+tools.map(tool=>{
        const isActive=state.activeToolId===tool.id;
        const isTr=tool.type==='TRANCHEE', isPt=tool.type==='POINT', isAr=tool.type==='AREA', isTerr=tool.type==='TERRASSEMENT';
        const isHidden=!!tool.hidden;
        const len=tool.measurements.reduce((a,p)=>a+calculateLength(p,isAr||isTr||isTerr),0);
        const area=(isAr||isTerr)?tool.measurements.reduce((a,p)=>a+calculateArea(p),0):0;
        const vol=isTr?len*tool.trancheeW*tool.trancheeD : isTerr?area*(tool.terrZ||1):0;
        const sz=tool.pointSize||12;
        const preview=isPt
            ?`<div style="color:${isHidden?'var(--muted)':tool.color};opacity:${isHidden?0.35:1};transition:all 0.2s;">${VRD_ICONS[tool.vrdIcon||'regard'].svg}</div>`
            :`<div style="width:22px;height:${Math.max(isTr?(tool.thickness||20)/3:3,2)}px;border-radius:2px;background:${tool.color};opacity:${isHidden?0.2:isTr?0.55:1};flex-shrink:0;transition:opacity 0.2s;"></div>`;
        const eyeBtn = `<button onclick="event.stopPropagation();toggleToolVisibility('${tool.id}')" title="${isHidden?'Afficher':'Masquer'}" style="background:#18181b;border:1px solid var(--border2);border-radius:6px;padding:3px 6px;cursor:pointer;color:${isHidden?'var(--amber)':'var(--muted)'};transition:all 0.1s;" onmouseover="this.style.color='var(--white)'" onmouseout="this.style.color='${isHidden?'var(--amber)':'var(--muted)'}'">
            ${isHidden
                ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`}
        </button>`;
        return`<div class="tool-card ${isActive?'active':''}" style="${isHidden?'opacity:0.5;':''}" onclick="setActiveTool('${tool.id}')">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
                <div style="display:flex;align-items:center;gap:9px;flex:1;min-width:0;">${preview}<span style="font-weight:700;font-size:0.78rem;color:${isActive?'#fff':'var(--text)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${tool.name}</span></div>
                <div style="display:flex;gap:4px;flex-shrink:0;margin-left:6px;">
                    ${eyeBtn}
                    <button onclick="event.stopPropagation();openCreator('edit','${tool.id}')" style="background:#18181b;border:1px solid var(--border2);border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--muted);transition:all 0.1s;" onmouseover="this.style.color='#fff';this.style.background='var(--border2)'" onmouseout="this.style.color='var(--muted)';this.style.background='#18181b'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                    <button onclick="event.stopPropagation();deleteTool('${tool.id}')" style="background:#18181b;border:1px solid var(--border2);border-radius:6px;padding:3px 6px;cursor:pointer;color:var(--muted);transition:all 0.1s;" onmouseover="this.style.color='#ef4444';this.style.borderColor='#450a0a';this.style.background='#1f0808'" onmouseout="this.style.color='var(--muted)';this.style.borderColor='var(--border2)';this.style.background='#18181b'"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>
                </div>
            </div>
            ${state.pendingDeleteTool===tool.id ? `
            <div onclick="event.stopPropagation()" style="padding:7px 9px;background:#1f0808;border:1px solid #450a0a;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <span style="font-size:0.67rem;color:#fca5a5;">Supprimer ?</span>
                <div style="display:flex;gap:5px;">
                    <button onclick="event.stopPropagation();confirmDeleteTool()" style="background:#dc2626;color:#fff;border:none;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:0.68rem;font-weight:700;font-family:inherit;">Oui</button>
                    <button onclick="event.stopPropagation();cancelDeleteTool()" style="background:#27272a;color:var(--muted);border:none;border-radius:5px;padding:3px 10px;cursor:pointer;font-size:0.68rem;font-family:inherit;">Non</button>
                </div>
            </div>` : ''}
            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid var(--border);">
                <span style="font-size:0.6rem;color:var(--border2);text-transform:uppercase;letter-spacing:0.07em;">${isTr?`${tool.trancheeW}m×${tool.trancheeD}m`:isPt?`${sz}px · unités`:isAr?'surface':'linéaire'}</span>
                <div style="text-align:right;line-height:1.3;">
                    ${isTr?`<div style="font-family:monospace;font-weight:700;color:var(--amber);font-size:0.75rem;">${vol.toFixed(2)} m³</div><div style="font-family:monospace;font-size:0.68rem;color:var(--muted);">${len.toFixed(2)} ml</div>`:''}
                    ${isAr?`<div style="font-family:monospace;font-weight:700;color:var(--amber);font-size:0.75rem;">${area.toFixed(2)} m²</div><div style="font-family:monospace;font-size:0.68rem;color:var(--muted);">${len.toFixed(2)} ml</div>`:''}
                    ${isTerr?`<div style="font-family:monospace;font-weight:700;color:var(--amber);font-size:0.75rem;">${tool.terrType==='remblais'?'+':'-'}${vol.toFixed(2)} m³</div><div style="font-size:0.6rem;font-weight:700;color:${tool.terrType==='remblais'?'#fdba74':'#93c5fd'};">${tool.terrType==='remblais'?'▲ Remblais':'▼ Déblais'}</div>`:''}
                    ${tool.type==='VRD'?`<div style="font-family:monospace;font-weight:700;color:var(--amber);font-size:0.75rem;">${len.toFixed(2)} ml</div>`:''}
                    ${isPt?`<div style="font-family:monospace;font-weight:700;color:var(--amber);font-size:0.75rem;">${tool.measurements.length} u</div>`:''}
                </div>
            </div>
        </div>`;
    }).join('')+'</div>';}

function buildSummary(){
    const vrd=state.tools.filter(t=>t.type==='VRD');
    const tr=state.tools.filter(t=>t.type==='TRANCHEE');
    const ar=state.tools.filter(t=>t.type==='AREA');
    const pt=state.tools.filter(t=>t.type==='POINT');
    const totalVrd=vrd.reduce((a,t)=>a+t.measurements.reduce((s,p)=>s+calculateLength(p,false),0),0);
    const totalTr=tr.reduce((a,t)=>{ const l=t.measurements.reduce((s,p)=>s+calculateLength(p,false),0); return a+l*t.trancheeW*t.trancheeD; },0);
    const totalAr=ar.reduce((a,t)=>a+t.measurements.reduce((s,p)=>s+calculateArea(p),0),0);
    const totalPt=pt.reduce((a,t)=>a+t.measurements.length,0);
    const sec=(title,rows,tot,unit)=>`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;">
        <div style="background:#111;padding:9px 13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:0.68rem;font-weight:700;color:#fff;">${title}</span>
            <span style="font-family:monospace;font-size:0.72rem;font-weight:700;color:var(--amber);background:#1c0f00;padding:2px 8px;border-radius:5px;">${tot} ${unit}</span>
        </div>
        <div style="padding:5px 13px;">${rows.length?rows.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border);"><div style="display:flex;align-items:center;gap:7px;"><div style="width:7px;height:7px;border-radius:50%;background:${r.color};flex-shrink:0;"></div><span style="font-size:0.75rem;color:var(--text);font-weight:700;">${r.name}</span></div><span style="font-family:monospace;font-size:0.72rem;color:var(--muted);">${r.val} ${r.unit}</span></div>`).join(''):`<p style="font-size:0.65rem;color:var(--border2);padding:8px 0;">Aucune donnée</p>`}</div>
    </div>`;
    return`<div style="display:flex;flex-direction:column;gap:9px;">
        ${sec('VRD — Linéaires',vrd.map(t=>({color:t.color,name:t.name,val:t.measurements.reduce((a,p)=>a+calculateLength(p,false),0).toFixed(2),unit:'ml'})),totalVrd.toFixed(2),'ml')}
        ${sec('Tranchées — Volumes',tr.map(t=>{const l=t.measurements.reduce((a,p)=>a+calculateLength(p,false),0);return{color:t.color,name:t.name,val:(l*t.trancheeW*t.trancheeD).toFixed(2),unit:'m³'};}),totalTr.toFixed(2),'m³')}
        ${sec('Surfaces',ar.map(t=>({color:t.color,name:t.name,val:t.measurements.reduce((a,p)=>a+calculateArea(p),0).toFixed(2),unit:'m²'})),totalAr.toFixed(2),'m²')}
        ${sec('Pointage VRD',pt.map(t=>({color:t.color,name:t.name,val:t.measurements.length,unit:'u'})),totalPt,'u')}
        <button onclick="generatePrintImage()" style="display:flex;align-items:center;justify-content:center;gap:7px;background:var(--amber-dk);color:#000;padding:11px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:0.78rem;font-family:inherit;" onmouseover="this.style.background='var(--amber)'" onmouseout="this.style.background='var(--amber-dk)'">🖨️ Imprimer le Devis</button>
    </div>`;}

// CANVAS
function drawCanvas(){
    if(!state.plans||!state.plans.length) return;
    ctx.clearRect(0,0,els.drawCanvas.width,els.drawCanvas.height);
    // Ordre : Tranchées en fond, puis VRD/Surfaces, puis Pointages au-dessus
    const ORDER = ['TRANCHEE','AREA','VRD','POINT'];
    [...state.tools].sort((a,b)=>ORDER.indexOf(a.type)-ORDER.indexOf(b.type))
        .forEach(tool=>{ if(!tool.hidden) tool.measurements.forEach(pts=>drawShape(pts,tool,false)); });
    if(state.currentLine.length>0&&state.pixelsPerMeter&&!state.isEraserMode){
        const at=state.tools.find(t=>t.id===state.activeToolId);
        if(at) drawShape([...state.currentLine,state.mousePos],at,true);
    }
    // Réticule superposition (suit le curseur)
    if(state.superpositionMode){
        const mx=state.mousePos.x, my=state.mousePos.y;
        ctx.strokeStyle='rgba(245,158,11,0.7)'; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(mx-18,my); ctx.lineTo(mx+18,my); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mx,my-18); ctx.lineTo(mx,my+18); ctx.stroke();
        ctx.beginPath(); ctx.arc(mx,my,4,0,2*Math.PI); ctx.stroke();

        // Flèche entre clic1 et curseur
        if(state.superpositionClick1){
            const c=state.superpositionClick1;
            const ex=mx, ey=my;
            const dx=ex-c.x, dy=ey-c.y;
            const len=Math.sqrt(dx*dx+dy*dy);
            // Ligne pointillée
            ctx.strokeStyle='rgba(245,158,11,0.9)'; ctx.lineWidth=1.5;
            ctx.setLineDash([6,4]);
            ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(ex,ey); ctx.stroke();
            ctx.setLineDash([]);
            // Tête de flèche
            if(len>10){
                const angle=Math.atan2(dy,dx);
                const al=12, aw=0.4;
                ctx.fillStyle='rgba(245,158,11,0.9)';
                ctx.beginPath();
                ctx.moveTo(ex,ey);
                ctx.lineTo(ex-al*Math.cos(angle-aw), ey-al*Math.sin(angle-aw));
                ctx.lineTo(ex-al*Math.cos(angle+aw), ey-al*Math.sin(angle+aw));
                ctx.closePath(); ctx.fill();
            }
            // Cercle point 1
            ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.arc(c.x,c.y,6,0,2*Math.PI); ctx.stroke();
            ctx.fillStyle='rgba(245,158,11,0.25)'; ctx.fill();
            // Distance en px → mètres si disponible
            if(state.pixelsPerMeter && len > 5){
                const dist=(len/state.pixelsPerMeter).toFixed(2);
                const mx2=(c.x+ex)/2, my2=(c.y+ey)/2;
                ctx.fillStyle='rgba(15,15,15,0.75)';
                ctx.beginPath(); ctx.roundRect(mx2-22,my2-10,44,16,4); ctx.fill();
                ctx.fillStyle='#f59e0b'; ctx.font='bold 10px monospace';
                ctx.textAlign='center'; ctx.fillText(dist+' m',mx2,my2+2); ctx.textAlign='left';
            }
        }
    }
    if(state.isEraserMode){
        ctx.strokeStyle='rgba(239,68,68,0.7)';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(state.mousePos.x,state.mousePos.y,14,0,2*Math.PI);ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(state.mousePos.x-4,state.mousePos.y-4);ctx.lineTo(state.mousePos.x+4,state.mousePos.y+4);
        ctx.moveTo(state.mousePos.x+4,state.mousePos.y-4);ctx.lineTo(state.mousePos.x-4,state.mousePos.y+4);
        ctx.stroke();
    }
}

// ─── Dessin d'une icône VRD sur un contexte canvas ───
function drawVrdIcon(ctx, ik, px, py, s){
    if(ik==='regard_visite'){
        ctx.beginPath();ctx.arc(px,py-s*0.1,s*0.85,0,2*Math.PI);ctx.stroke();
        ctx.beginPath();ctx.arc(px,py-s*0.1,s*0.65,0,2*Math.PI);ctx.stroke();
        ctx.strokeRect(px-s*0.45,py+s*0.75,s*0.9,s*0.45);
    } else if(ik==='grille_plate'){
        const hw=s*1.1; ctx.strokeRect(px-hw,py-hw,hw*2,hw*2);
        ctx.beginPath();
        for(let i=1;i<=5;i++){const lx=px-hw+(hw*2/6)*i;ctx.moveTo(lx,py-hw);ctx.lineTo(lx,py+hw);}
        ctx.stroke();
    } else if(ik==='grille_fendue'){
        const hw=s*1.1; ctx.strokeRect(px-hw,py-hw,hw*2,hw*2);
        ctx.beginPath();
        for(let i=1;i<=5;i++){const lx=px-hw+(hw*2/6)*i;ctx.moveTo(lx,py-hw);ctx.lineTo(lx,py+hw);}
        ctx.moveTo(px-hw,py);ctx.lineTo(px+hw,py); ctx.stroke();
    } else if(ik==='vanne'){
        const h=s*1.6;
        ctx.beginPath();
        ctx.moveTo(px-s*0.8,py-h/2);ctx.lineTo(px-s*0.8,py+h/2);
        ctx.moveTo(px+s*0.8,py-h/2);ctx.lineTo(px+s*0.8,py+h/2);
        ctx.moveTo(px+s*0.8,py-h/2);ctx.lineTo(px-s*0.8,py+h/2);
        ctx.moveTo(px-s*0.8,py-h/2);ctx.lineTo(px+s*0.8,py+h/2);
        ctx.stroke();
    } else if(ik==='lampadaire'){
        ctx.beginPath();ctx.arc(px,py-s*1.1,s*0.7,0,2*Math.PI);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px,py-s*0.4);ctx.lineTo(px,py+s*1.5);ctx.stroke();
    } else if(ik==='candelabre_double'){
        ctx.beginPath();ctx.arc(px-s*0.8,py-s*1.1,s*0.6,0,2*Math.PI);ctx.stroke();
        ctx.beginPath();ctx.arc(px+s*0.8,py-s*1.1,s*0.6,0,2*Math.PI);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px,py-s*0.5);ctx.lineTo(px,py+s*1.5);ctx.stroke();
    } else if(ik==='borne_lumineuse'){
        const rw=s*0.5,rh=s*2.0; ctx.strokeRect(px-rw,py-rh/2,rw*2,rh);
        const yt=py-rh/2+rh*0.15, yb=py-rh/2+rh*0.45;
        ctx.beginPath();ctx.moveTo(px-rw,yt);ctx.lineTo(px+rw,yt);ctx.moveTo(px-rw,yb);ctx.lineTo(px+rw,yb);ctx.stroke();
        ctx.beginPath();ctx.arc(px,(yt+yb)/2,(yb-yt)*0.38,0,2*Math.PI);ctx.stroke();
    } else if(ik==='chambre_telecom'){
        const rw=s*1.3,rh=s*2.5; ctx.strokeRect(px-rw/2,py-rh/2,rw,rh);
        ctx.beginPath();ctx.moveTo(px-rw/2,py);ctx.lineTo(px+rw/2,py);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px-rw/2,py-rh/2);ctx.lineTo(px+rw/2,py);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px-rw/2,py);ctx.lineTo(px+rw/2,py+rh/2);ctx.stroke();
    } else if(ik==='panneau_signa'){
        ctx.strokeRect(px-s*0.7,py-s*1.8,s*1.4,s*1.4);
        ctx.beginPath();ctx.moveTo(px,py-s*0.4);ctx.lineTo(px,py+s*1.5);ctx.stroke();
    } else if(ik==='borne_irve'){
        ctx.strokeRect(px-s*0.8,py-s*1.6,s*1.6,s*3.0);
        ctx.beginPath();ctx.moveTo(px+s*0.3,py-s*1.2);ctx.lineTo(px-s*0.2,py-s*0.1);ctx.lineTo(px+s*0.2,py-s*0.1);ctx.lineTo(px-s*0.3,py+s*1.0);ctx.stroke();
    }
}

// ─── Génère un dataUrl 32x32 représentant l'icône d'un outil pour le PDF ───
function makeToolIconDataUrl(tool){
    const SZ=32, c=document.createElement('canvas'); c.width=c.height=SZ;
    const ctx=c.getContext('2d'); ctx.clearRect(0,0,SZ,SZ);
    const col=tool.color||'#3b82f6';
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineCap='round'; ctx.lineJoin='round';
    const cx=SZ/2, cy=SZ/2;
    if(tool.type==='VRD'){
        ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(2,cy+3);ctx.lineTo(8,cy-3);ctx.lineTo(14,cy+3);ctx.lineTo(20,cy-3);ctx.lineTo(26,cy+2);ctx.lineTo(30,cy);ctx.stroke();
    } else if(tool.type==='TRANCHEE'){
        ctx.globalAlpha=0.55; ctx.fillRect(1,cy-7,SZ-2,14); ctx.globalAlpha=1;
        ctx.lineWidth=2; ctx.strokeRect(1,cy-7,SZ-2,14);
    } else if(tool.type==='AREA'){
        ctx.globalAlpha=0.25;
        ctx.beginPath();ctx.moveTo(cx,2);ctx.lineTo(SZ-2,SZ-2);ctx.lineTo(2,SZ-2);ctx.closePath();ctx.fill();
        ctx.globalAlpha=1; ctx.lineWidth=2; ctx.stroke();
    } else if(tool.type==='TERRASSEMENT'){
        const isR=tool.terrType==='remblais';
        ctx.lineWidth=2;
        ctx.beginPath();
        if(isR){ctx.moveTo(cx,4);ctx.lineTo(SZ-4,SZ-4);ctx.lineTo(4,SZ-4);ctx.closePath();}
        else{ctx.moveTo(cx,SZ-4);ctx.lineTo(SZ-4,4);ctx.lineTo(4,4);ctx.closePath();}
        ctx.globalAlpha=0.25; ctx.fill(); ctx.globalAlpha=1; ctx.stroke();
    } else if(tool.type==='POINT'){
        // Cercle coloré + icône blanche
        ctx.lineWidth=2;
        ctx.globalAlpha=0.8; ctx.beginPath();ctx.arc(cx,cy,14,0,2*Math.PI);ctx.fill(); ctx.globalAlpha=1;
        ctx.beginPath();ctx.arc(cx,cy,14,0,2*Math.PI);ctx.stroke();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
        drawVrdIcon(ctx, tool.vrdIcon||'regard_visite', cx, cy, 6);
    }
    return c.toDataURL('image/png');
}

function drawShape(points,tool,isPreview){
    if(!points.length) return;
    const color=tool.color||'#3b82f6';
    const thick=tool.thickness||3;
    const type=tool.type;
    ctx.save();

    if(type==='POINT'){
        const p=points[0];
        const r=tool.pointSize||12;
        ctx.fillStyle=color+'cc'; ctx.strokeStyle=color; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,2*Math.PI); ctx.fill(); ctx.stroke();
        const s=r*0.45;
        ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,r*0.1);
        drawVrdIcon(ctx, tool.vrdIcon||'regard_visite', p.x, p.y, s);
        ctx.restore(); return;
    }

    ctx.lineCap='round'; ctx.lineJoin='round';

    if(type==='TRANCHEE'){
        // Surligneur large translucide
        ctx.strokeStyle=color+(isPreview?'40':'50');
        ctx.lineWidth=Math.max(thick,6);
        ctx.setLineDash(isPreview?[18,6]:[]);
        ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
        for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
        ctx.stroke();
        // Bord fin
        ctx.strokeStyle=color+'90'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); ctx.stroke();
        if(!isPreview){
            ctx.setLineDash([]); ctx.fillStyle=color; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
            points.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3,0,2*Math.PI);ctx.fill();ctx.stroke();});
        }
        ctx.restore(); return;
    }

    if(type==='TERRASSEMENT'){
        if(points.length < 2){ ctx.restore(); return; }
        const tracePoly = () => {
            ctx.beginPath();
            ctx.moveTo(points[0].x,points[0].y);
            for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
            if(points.length>=3) ctx.closePath();
        };
        if(!isPreview && points.length>=3){
            ctx.save();
            tracePoly();
            ctx.clip();
            // Fond semi-transparent
            ctx.fillStyle=color+'18';
            ctx.fill();
            // Hachures diagonales
            const bb={x0:Math.min(...points.map(p=>p.x)),x1:Math.max(...points.map(p=>p.x)),
                      y0:Math.min(...points.map(p=>p.y)),y1:Math.max(...points.map(p=>p.y))};
            ctx.strokeStyle=color+'70'; ctx.lineWidth=1; ctx.setLineDash([]);
            const isRemblais = tool.terrType==='remblais';
            const sym = isRemblais ? '▲' : '▼';
            ctx.fillStyle = color + 'cc';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const stepX = 18, stepY = 16;
            for(let y2 = bb.y0 + stepY*0.5; y2 < bb.y1; y2 += stepY){
                for(let x2 = bb.x0 + stepX*0.5; x2 < bb.x1; x2 += stepX){
                    ctx.fillText(sym, x2, y2);
                }
            }
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.restore();
        }
        // Contour du polygone
        tracePoly();
        ctx.strokeStyle=color; ctx.lineWidth=1.5;
        ctx.setLineDash(isPreview?[7,4]:[]);
        ctx.stroke(); ctx.setLineDash([]);
        // Points de tracé
        if(!isPreview){
            ctx.fillStyle='#fff'; ctx.strokeStyle=color; ctx.lineWidth=1.5;
            points.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,2*Math.PI);ctx.fill();ctx.stroke();});
        }
        ctx.restore(); return;
    }

    ctx.beginPath(); ctx.moveTo(points[0].x,points[0].y);
    for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x,points[i].y);
    if(type==='AREA'&&points.length>=3){
        ctx.closePath();
        if(!isPreview){ctx.fillStyle=color+'30';ctx.fill();}
    }
    // VRD et AREA : trait fin 1.5px fixe
    ctx.strokeStyle=color; ctx.lineWidth=1.5;
    ctx.setLineDash(isPreview?[7,4]:[]);
    ctx.stroke(); ctx.setLineDash([]);
    if(!isPreview){
        ctx.lineWidth=1;
        points.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle=color;ctx.stroke();});
    }
    ctx.restore();
}

// ACTIONS
function toggleTab(tabName){
    if(['VRD','TRANCHEE','AREA','TERRASSEMENT','POINT','ITEM','SUMMARY'].includes(tabName)&&!state.pixelsPerMeter) return;

    // Boutons d'outils : ouvre le creator bar avec le bon type, tiroir ITEM reste visible
    if(['VRD','TRANCHEE','AREA','TERRASSEMENT','POINT'].includes(tabName)){
        if(state.isEraserMode) state.isEraserMode=false;
        // Sélectionner le premier outil existant de ce type comme outil actif de dessin
        const typed=state.tools.filter(t=>t.type===tabName);
        const currentOk=typed.find(t=>t.id===state.activeToolId);
        state.activeToolId = currentOk ? state.activeToolId : (typed.length?typed[0].id:null);
        // Ouvrir le bandeau de création avec ce type
        openCreator('new', null, tabName);
        return;
    }

    // SUMMARY = impression directe
    if(tabName==='SUMMARY'){
        if(!state.tools.length) return alert("Aucun outil à imprimer.");
        generatePrintImage();
        return;
    }

    // SETUP et ITEM = tiroir normal
    if(state.activeTab===tabName&&state.isDrawerOpen){ setState({isDrawerOpen:false}); return; }
    let upd={activeTab:tabName,isDrawerOpen:true};
    if(state.isEraserMode) upd.isEraserMode=false;
    if(state.isCreatorOpen&&tabName!==state.activeTab) upd.isCreatorOpen=false;
    setState(upd);
}
function toggleToolVisibility(id){
    const newTools=state.tools.map(t=>t.id===id?{...t,hidden:!t.hidden}:t);
    setState({tools:newTools});
}
function toggleGroupVisibility(type){
    const tools=state.tools.filter(t=>t.type===type);
    const allHidden=tools.every(t=>t.hidden);
    const newTools=state.tools.map(t=>t.type===type?{...t,hidden:!allHidden}:t);
    setState({tools:newTools});
}
function closeDrawer(){ setState({isDrawerOpen:false}); }
function setPlanName(i, val) {
    const newPlans = state.plans.map((p, idx) => idx===i ? {...p, name: val.trim()||`Plan ${i+1}`} : p);
    state.plans = newPlans; // silencieux, pas besoin de re-render complet
}

function setPlanScale(i, val) {
    const s = parseFloat(val);
    if (isNaN(s) || s <= 0) return;
    const newPlans = state.plans.map((p, idx) => idx===i ? {...p, scaleRatio: String(s)} : p);
    // Si plan 0 change, mettre à jour pixelsPerMeter
    if (i === 0) {
        const ppm = (1000*72*2.5)/(25.4*s);
        setState({ plans: newPlans, scaleRatioInput: String(s), pixelsPerMeter: ppm, appState:'MEASURE' });
    } else {
        setState({ plans: newPlans });
    }
}

function rotatePlan(i) {
    const newPlans = state.plans.map((p, idx) => idx===i ? {...p, rotation: ((p.rotation||0) + 90) % 360} : p);
    setState({ plans: newPlans });
}
function setSuperTarget(i) {
    // Active le mode superposition et sélectionne le plan i comme cible
    setState({ superpositionMode: true, superpositionTargetIdx: i, superpositionClick1: null });
}
function toggleSuperpositionMode() {
    setState({ superpositionMode: !state.superpositionMode, superpositionClick1: null, superpositionTargetIdx: null });
}

function toggleEraser(){ setState({isEraserMode:!state.isEraserMode}); }
function resetScale(){ setState({pixelsPerMeter:null,appState:'SETUP_SCALE'}); }
function setActiveTool(id){ setState({activeToolId:id}); }
function deleteTool(id){
    setState({ pendingDeleteTool: id });
}
function confirmDeleteTool(){
    const id = state.pendingDeleteTool;
    if(!id) return;
    const newTools=state.tools.filter(t=>t.id!==id); let upd={tools:newTools, pendingDeleteTool:null};
    if(state.activeToolId===id){const rem=newTools.filter(t=>t.type===state.activeTab);upd.activeToolId=rem.length?rem[0].id:null;}

// IMPORT/EXPORT
async function handleFileUpload(event){
    const file=event.target.files[0]; if(!file) return; setState({isLoading:true});
    try{
        if(file.type==='application/pdf'){
            if(!window.pdfjsLib){const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';await new Promise((r,j)=>{s.onload=r;s.onerror=j;document.head.appendChild(s);});window.pdfjsLib=window['pdfjs-dist/build/pdf'];window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
            const buf=await file.arrayBuffer();const pdf=await window.pdfjsLib.getDocument(buf).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:2.5});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;loadImageFromUrl(c.toDataURL('image/png'),true);
        } else {const reader=new FileReader();reader.onload=e=>loadImageFromUrl(e.target.result,false);reader.readAsDataURL(file);}

// Calcule le scale visuel d'un plan par rapport au plan de référence
function computePlanScale(plan, ref) {
    if (!plan.scaleRatio || !ref.scaleRatio) return 1;
    return parseFloat(ref.scaleRatio) / parseFloat(plan.scaleRatio);
}

// Retourne le transform CSS correct selon la rotation
function planCssTransform(plan, sc) {
    const ox = plan.offsetX || 0;
    const oy = plan.offsetY || 0;
    const rot = plan.rotation || 0;
    const w = plan.w * sc;
    const h = plan.h * sc;
    switch(rot) {
        case  90: return `translate(${ox}px,${oy + w}px) rotate(90deg) scale(${sc})`;
        case 180: return `translate(${ox + w}px,${oy + h}px) rotate(180deg) scale(${sc})`;
        case 270: return `translate(${ox + h}px,${oy}px) rotate(270deg) scale(${sc})`;
        default:  return `translate(${ox}px,${oy}px) scale(${sc})`;
    }
}

// Retourne le bounding box d'un plan dans l'espace container
function planBBox(plan, sc) {
    const ox = plan.offsetX || 0;
    const oy = plan.offsetY || 0;
    const rot = (plan.rotation || 0) % 180;
    const ew = rot === 90 ? plan.h * sc : plan.w * sc; // effective width
    const eh = rot === 90 ? plan.w * sc : plan.h * sc; // effective height
    return { x: ox, y: oy, w: ew, h: eh };
}

function loadImageFromUrl(src, isPdf){
    const img=new Image();
    img.onload=()=>{
        const isFirst = state.plans.length===0;
        const scaleRatio = state.scaleRatioInput || '50';
        const newPlan = {
            id: Date.now().toString(), src, isPdf, opacity:1,
            w:img.width, h:img.height,
            name: `Plan ${state.plans.length + 1}`,
            scaleRatio,
            rotation: 0,
            offsetX: 0, offsetY: 0
        };
        const newPlans = [...state.plans, newPlan];
        const updates = { plans:newPlans, isLoading:false };
        if(isFirst){
            updates.imageSize = {w:img.width, h:img.height};
            updates.transform = {scale:1,x:0,y:0};
            // Calculer pixelsPerMeter automatiquement depuis scaleRatio
            const s = parseFloat(scaleRatio);
            if(s > 0) {
                updates.pixelsPerMeter = (1000*72*2.5)/(25.4*s);
                updates.appState = 'MEASURE';
            } else {

function movePlan(i, dir){

    const j=i+dir;
    if(j<0||j>=plans.length) return;
    [plans[i],plans[j]]=[plans[j],plans[i]];
    setState({plans});
}
function removePlan(i){
    const plans=state.plans.filter((_,idx)=>idx!==i);
    const updates={plans};
    if(plans.length===0){ updates.appState='UPLOAD'; updates.pixelsPerMeter=null; updates.imageSize={w:0,h:0}; }
    else { updates.imageSize={w:plans[0].w,h:plans[0].h}; }
    setState(updates);
}

// MATHS
const dist=(a,b)=>Math.sqrt((b.x-a.x)**2+(b.y-a.y)**2);
const calculateLength=(pts,closed)=>{if(pts.length<2||!state.pixelsPerMeter)return 0;let l=0;for(let i=1;i<pts.length;i++)l+=dist(pts[i-1],pts[i]);if(closed&&pts.length>2)l+=dist(pts[pts.length-1],pts[0]);return l/state.pixelsPerMeter;};
const calculateArea=pts=>{if(pts.length<3||!state.pixelsPerMeter)return 0;let a=0;for(let i=0;i<pts.length;i++){let j=(i+1)%pts.length;a+=pts[i].x*pts[j].y-pts[j].x*pts[i].y;}return Math.abs(a)/2/state.pixelsPerMeter**2;};
const distToSeg=(p,v,w)=>{const l2=(w.x-v.x)**2+(w.y-v.y)**2;if(!l2)return dist(p,v);let t=Math.max(0,Math.min(1,((p.x-v.x)*(w.x-v.x)+(p.y-v.y)*(w.y-v.y))/l2));return dist(p,{x:v.x+t*(w.x-v.x),y:v.y+t*(w.y-v.y)});};

// IMPRESSION — groupée par indice
async function generatePrintImage(){
    if (state.folders && state.folders.length > 0) {
        // PDF structuré par dossiers
        await generatePrintByFolders();
    } else {
        await generatePrintImageForTools(state.tools, 'MAPULATOR');
    }
}

async function generatePrintByFolders(){
    if (!window.jspdf) {
        await new Promise((res,rej)=>{
            const s=document.createElement('script');
            s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
            s.onload=res; s.onerror=rej; document.head.appendChild(s);
        });
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
    const TYPE_UNIT  = {VRD:'ml', TRANCHEE:'m³', AREA:'m²', TERRASSEMENT:'m³', POINT:'u'};
    const TYPE_LABEL = {VRD:'VRD', TRANCHEE:'Tranchée', AREA:'Surface', TERRASSEMENT:'Terrassement', POINT:'Pointage'};
    const TYPE_ORDER = {VRD:0, AREA:1, TRANCHEE:2, TERRASSEMENT:3, POINT:4};
    const W=210, pad=14, colType=130, colNet=158, colMaj=196;
    const RH=6.5, GH=5;

    // Recueillir tous les indices dans des dossiers
    const inFolder = new Set(state.folders.flatMap(f=>f.indiceKeys||[]));

    // Grouper tous les outils par indice
    const allGroups = {};
    state.tools.forEach(t=>{
        const k = t.indice&&t.indice.trim() ? t.indice.trim().toUpperCase() : '__DIVERS__';
        if (!allGroups[k]) allGroups[k]=[];
        allGroups[k].push(t);
    });
    Object.keys(allGroups).forEach(k=>{
        allGroups[k]=allGroups[k].slice().sort((a,b)=>(TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9));
    });

    // Sections : dossiers d'abord, puis indices libres
    const sections = [
        ...state.folders.map(f=>({ type:'folder', name:f.name, keys:(f.indiceKeys||[]).filter(k=>allGroups[k]) })),
    ];
    const freeKeys = Object.keys(allGroups).filter(k=>!inFolder.has(k)&&k!=='__DIVERS__').sort();
    if (allGroups['__DIVERS__']&&!inFolder.has('__DIVERS__')) freeKeys.push('__DIVERS__');
    if (freeKeys.length) sections.push({ type:'free', name:'Indices libres', keys:freeKeys });

    let firstPage = true;

    const drawPageHeader = (title, subtitle) => {
        doc.setFillColor(15,15,15); doc.rect(0,0,210,22,'F');
        doc.setTextColor(245,158,11); doc.setFont('helvetica','bold'); doc.setFontSize(13);
        doc.text('MAPULATOR', pad, 10);
        doc.setTextColor(200,200,200); doc.setFont('helvetica','normal'); doc.setFontSize(8);
        doc.text(subtitle, pad, 16);
        doc.setTextColor(120,120,120);
        doc.text('Généré le '+new Date().toLocaleString('fr-FR'), W-pad, 16, {align:'right'});
    };

    const drawColHeaders = (y) => {
        doc.setFillColor(240,240,240); doc.rect(pad,y-4,W-pad*2,7,'F');
        doc.setTextColor(80,80,80); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
        doc.text('DÉSIGNATION',pad+5,y);
        doc.text('TYPE',colType,y,{align:'right'});
        doc.text('NET',colNet,y,{align:'right'});
        doc.text('+10%',colMaj,y,{align:'right'});
    };

    for (const section of sections) {
        if (!section.keys.length) continue;
        if (!firstPage) doc.addPage();
        firstPage = false;

        const subtitle = section.type==='folder' ? `Dossier — ${section.name}` : 'Indices libres';
        drawPageHeader('MAPULATOR', subtitle);

        let y = 30;
        drawColHeaders(y); y += 7;

        for (const key of section.keys) {
            const tools = allGroups[key] || [];
            if (!tools.length) continue;
            if (y > 265) { doc.addPage(); y = 20; drawColHeaders(y); y += 7; }

            // Header indice
            doc.setFillColor(25,25,25); doc.rect(pad,y-4,W-pad*2,7,'F');
            doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8);
            doc.text(key==='__DIVERS__'?'Divers':key, pad+3, y);
            y += 8;

            tools.forEach((t,i) => {
                if (y > 275) { doc.addPage(); y = 20; drawColHeaders(y); y += 7; }
                let net=0;
                if(t.type==='VRD') net=t.measurements.reduce((a,p)=>a+calculateLength(p,false),0);
                else if(t.type==='TRANCHEE'){const l=t.measurements.reduce((a,p)=>a+calculateLength(p,false),0);net=l*(t.trancheeW||0.8)*(t.trancheeD||1.2);}
                else if(t.type==='AREA') net=t.measurements.reduce((a,p)=>a+calculateArea(p),0);
                else if(t.type==='TERRASSEMENT'){const a=t.measurements.reduce((s,p)=>s+calculateArea(p),0);net=a*(t.terrZ||1);}
                else net=t.measurements.length;
                // Label dynamique déblais/remblais
                const tLabel = t.type==='TERRASSEMENT'
                    ? (t.terrType==='remblais'?'Remblais':'Déblais')
                    : (TYPE_LABEL[t.type]||'');
                const unit=TYPE_UNIT[t.type]||'';
                const maj = t.type==='POINT' ? null : net*1.1;
                if(i%2===0){doc.setFillColor(250,250,250);doc.rect(pad,y-4,W-pad*2,RH,'F');}
                // Icône outil
                const iconDataUrl = makeToolIconDataUrl(t);
                doc.addImage(iconDataUrl, 'PNG', pad, y-4.5, 6, 6);
                doc.setTextColor(30,30,30); doc.setFont('helvetica','normal'); doc.setFontSize(8);
                doc.text(t.name, pad+8, y);
                doc.setTextColor(130,130,130); doc.setFontSize(7);
                doc.text(tLabel, colType, y, {align:'right'});
                const netDisplay = t.type==='TERRASSEMENT'
                    ? (t.terrType==='remblais'?'+':'-') + net.toFixed(2) + ' ' + unit
                    : net.toFixed(2) + ' ' + unit;
                const majDisplay = maj!==null
                    ? (t.type==='TERRASSEMENT'?(t.terrType==='remblais'?'+':'-'):'') + (maj!==null?maj.toFixed(2):'') + ' ' + unit
                    : '—';
                doc.setTextColor(50,50,50); doc.setFontSize(8);
                doc.text(netDisplay, colNet, y, {align:'right'});
                doc.setTextColor(180,82,9); doc.setFont('helvetica','bold');
                doc.text(majDisplay, colMaj, y, {align:'right'});
                y += RH;
            });
            y += GH;
        }
    }

    // Pagination
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){
        doc.setPage(p);
        doc.setDrawColor(220,220,220); doc.setLineWidth(0.3); doc.line(pad,287,W-pad,287);
        doc.setTextColor(160,160,160); doc.setFont('helvetica','normal'); doc.setFontSize(7);
        doc.text(`Page ${p} / ${pages}`, W/2, 291, {align:'center'});
    }

    doc.save(`Mapulator_${new Date().toISOString().slice(0,10)}.pdf`);
}

async function generatePrintImageForTools(tools, title){
    // Charger jsPDF si pas encore disponible
    if (!window.jspdf) {
        await new Promise((res,rej)=>{
            const s=document.createElement('script');
            s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
            s.onload=res; s.onerror=rej; document.head.appendChild(s);
        });
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });

    const TYPE_UNIT  = {VRD:'ml', TRANCHEE:'m³', AREA:'m²', TERRASSEMENT:'m³', POINT:'u'};
    const TYPE_LABEL = {VRD:'VRD', TRANCHEE:'Tranchée', AREA:'Surface', TERRASSEMENT:'Terrassement', POINT:'Pointage'};
    const W=210, pad=14, colType=130, colNet=158, colMaj=196;

    // Grouper par indice puis trier : VRD(ml) → AREA(m²) → TRANCHEE(m³) → POINT(u)
    const TYPE_ORDER = {VRD:0, AREA:1, TRANCHEE:2, TERRASSEMENT:3, POINT:4};
    const groups={};
    tools.forEach(t=>{
        const key=(t.indice&&t.indice.trim())?t.indice.trim().toUpperCase():'DIVERS';
        if(!groups[key]) groups[key]=[];
        groups[key].push(t);
    });
    const keys=Object.keys(groups).filter(k=>k!=='DIVERS').sort();
    if(groups['DIVERS']) keys.push('DIVERS');
    keys.forEach(k=>{
        groups[k] = groups[k].slice().sort((a,b)=>(TYPE_ORDER[a.type]??9)-(TYPE_ORDER[b.type]??9));
    });

    // ── EN-TÊTE ──
    doc.setFillColor(15,15,15);
    doc.rect(0,0,210,22,'F');
    doc.setTextColor(245,158,11);
    doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('MAPULATOR', pad, 10);
    doc.setTextColor(200,200,200); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    doc.text(title==='MAPULATOR' ? 'Récapitulatif par indice' : 'Dossier — '+title, pad, 16);
    doc.setTextColor(120,120,120);
    doc.text('Généré le '+new Date().toLocaleString('fr-FR'), W-pad, 16, {align:'right'});

    // ── EN-TÊTES COLONNES ──
    let y=30;
    doc.setFillColor(240,240,240); doc.rect(pad,y-4,W-pad*2,7,'F');
    doc.setTextColor(80,80,80); doc.setFont('helvetica','bold'); doc.setFontSize(7.5);
    doc.text('DÉSIGNATION', pad+5, y);
    doc.text('TYPE',    colType,  y, {align:'right'});
    doc.text('NET',     colNet,   y, {align:'right'});
    doc.text('+10%',    colMaj,   y, {align:'right'});
    y+=7;

    const RH=6.5, GH=4;

    keys.forEach(key=>{
        // Nouvelle page si besoin
        if(y>270){ doc.addPage(); y=20; }

        // Header groupe
        doc.setFillColor(25,25,25);
        doc.rect(pad, y-4, W-pad*2, 7, 'F');
        doc.setTextColor(255,255,255);
        doc.setFont('helvetica','bold'); doc.setFontSize(8);
        doc.text(key, pad+3, y);
        y+=8;

        groups[key].forEach((t,i)=>{
            if(y>275){ doc.addPage(); y=20; }

            let net=0;
            if(t.type==='VRD')      net=t.measurements.reduce((a,p)=>a+calculateLength(p,false),0);
            else if(t.type==='TRANCHEE'){ const l=t.measurements.reduce((a,p)=>a+calculateLength(p,false),0); net=l*(t.trancheeW||0.8)*(t.trancheeD||1.2); }
            else if(t.type==='AREA') net=t.measurements.reduce((a,p)=>a+calculateArea(p),0);
            else                     net=t.measurements.length;
            const unit=TYPE_UNIT[t.type]||'';
            const maj = t.type==='POINT' ? null : net*1.1;

            // Fond zébré
            if(i%2===0){ doc.setFillColor(250,250,250); doc.rect(pad,y-4,W-pad*2,RH,'F'); }

            // Icône outil
            const iconDataUrl = makeToolIconDataUrl(t);
            doc.addImage(iconDataUrl, 'PNG', pad, y-4.5, 6, 6);

            // Textes
            doc.setTextColor(30,30,30); doc.setFont('helvetica','normal'); doc.setFontSize(8);
            doc.text(t.name, pad+8, y);
            doc.setTextColor(130,130,130); doc.setFontSize(7);
            doc.text(TYPE_LABEL[t.type]||'', colType, y, {align:'right'});
            doc.setTextColor(50,50,50); doc.setFontSize(8);
            doc.text(net.toFixed(2)+' '+unit, colNet, y, {align:'right'});
            doc.setTextColor(180,82,9); doc.setFont('helvetica','bold');
            doc.text(maj!==null ? maj.toFixed(2)+' '+unit : '—', colMaj, y, {align:'right'});

            y+=RH;
        });
        y+=GH;
    });

    // ── PIED DE PAGE ──
    const pages=doc.getNumberOfPages();
    for(let p=1;p<=pages;p++){
        doc.setPage(p);
        doc.setDrawColor(220,220,220); doc.setLineWidth(0.3);
        doc.line(pad,287,W-pad,287);
        doc.setTextColor(160,160,160); doc.setFont('helvetica','normal'); doc.setFontSize(7);
        doc.text(`Page ${p} / ${pages}`, W/2, 291, {align:'center'});
    }

    doc.save(`Mapulator_${new Date().toISOString().slice(0,10)}.pdf`);
}

function hexToRgb(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return {r,g,b};
}

// INTERACTIONS
function getCoords(e){const r=els.drawCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(els.drawCanvas.width/r.width),y:(e.clientY-r.top)*(els.drawCanvas.height/r.height)};}
function toggleFullScreen(){const e=document.documentElement,isFs=document.fullscreenElement||document.webkitFullscreenElement;if(!isFs)(e.requestFullscreen||e.webkitRequestFullscreen||function(){alert('Non supporté')}).call(e);else(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{const btn=document.getElementById('btn-fs');if(btn)btn.querySelector('svg').innerHTML=(document.fullscreenElement||document.webkitFullscreenElement)?'<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>':'<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>';}));
function handleButtonZoom(f){if(!state.plans?.length)return;const ns=Math.min(Math.max(0.1,state.transform.scale*f),20);const r=els.workspace.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,ratio=ns/state.transform.scale;setState({transform:{scale:ns,x:cx-(cx-state.transform.x)*ratio,y:cy-(cy-state.transform.y)*ratio}});}
els.workspace.addEventListener('wheel',e=>{if(!state.plans?.length)return;e.preventDefault();const d=-e.deltaY*0.0015,ns=Math.min(Math.max(0.1,state.transform.scale*Math.exp(d)),20);const r=els.workspace.getBoundingClientRect(),ratio=ns/state.transform.scale;setState({transform:{scale:ns,x:(e.clientX-r.left)-((e.clientX-r.left)-state.transform.x)*ratio,y:(e.clientY-r.top)-((e.clientY-r.top)-state.transform.y)*ratio}});},{passive:false});
els.workspace.addEventListener('pointerdown',e=>{if(e.button===1||(e.button===0&&e.altKey)){e.preventDefault();setState({isPanning:true,panStart:{x:e.clientX-state.transform.x,y:e.clientY-state.transform.y}});}});
els.workspace.addEventListener('pointermove',e=>{
    if(state.isPanning){
        setState({transform:{...state.transform,x:e.clientX-state.panStart.x,y:e.clientY-state.panStart.y}});
    } else if(state.plans?.length){
        state.mousePos = getCoords(e);
        drawCanvas();
    }
});
['pointerup','pointerleave'].forEach(ev=>els.workspace.addEventListener(ev,()=>{if(state.isPanning)setState({isPanning:false});}));
els.drawCanvas.addEventListener('click',e=>{
    if(e.button!==0||state.isPanning||e.altKey) return;
    const pt=getCoords(e);

    // ── Mode Superposition ──
    if(state.superpositionMode){
        const targetIdx = state.superpositionTargetIdx ?? (state.plans.length > 1 ? state.plans.length-1 : 0);
        if(!state.superpositionClick1){
            setState({superpositionClick1:{x:pt.x,y:pt.y}});
        } else {
            const c1=state.superpositionClick1;
            const newPlans=state.plans.map((p,i)=>i===targetIdx
                ?{...p,offsetX:(p.offsetX||0)+(pt.x-c1.x),offsetY:(p.offsetY||0)+(pt.y-c1.y)}:p);
            setState({plans:newPlans,superpositionClick1:null});
        }
        return;
    }

    if(state.isEraserMode){
        let hit=false,newTools=[...state.tools];
        for(let t=newTools.length-1;t>=0&&!hit;t--){let meas=[...newTools[t].measurements];for(let m=meas.length-1;m>=0;m--){let pts=meas[m],isHit=false;if(newTools[t].type==='POINT'){if(pts.length&&dist(pt,pts[0])<=16)isHit=true;}else{for(let i=0;i<pts.length-1;i++)if(distToSeg(pt,pts[i],pts[i+1])<=16)isHit=true;if(newTools[t].type==='AREA'&&pts.length>=3&&distToSeg(pt,pts[pts.length-1],pts[0])<=16)isHit=true;}if(isHit){meas.splice(m,1);newTools[t]={...newTools[t],measurements:meas};hit=true;break;}}}
        if(hit)setState({tools:newTools}); return;
    }
    if(state.pixelsPerMeter && state.activeToolId){
        const activeTool=state.tools.find(t=>t.id===state.activeToolId);
        if(!activeTool||!['VRD','TRANCHEE','AREA','TERRASSEMENT','POINT'].includes(activeTool.type)) return;
        if(activeTool.type==='POINT'){setState({tools:state.tools.map(t=>t.id===state.activeToolId?{...t,measurements:[...t.measurements,[pt]]}:t)});return;}
        let upd={currentLine:[...state.currentLine,pt]};
        if(state.currentLine.length===0) upd.isDrawerOpen=false;
        setState(upd);
    }
});
const finishLine=e=>{if(e)e.preventDefault();if(state.isEraserMode||!state.currentLine.length)return;const tool=state.tools.find(t=>t.id===state.activeToolId);if(!tool)return;const min=(tool.type==='AREA')?3:2;if(state.currentLine.length>=min){setState({tools:state.tools.map(t=>t.id===state.activeToolId?{...t,measurements:[...t.measurements,state.currentLine]}:t),currentLine:[],isDrawerOpen:true});}else alert(`Minimum ${min} points.`);};
els.drawCanvas.addEventListener('contextmenu',finishLine);
els.drawCanvas.addEventListener('dblclick',finishLine);
window.addEventListener('keydown',e=>{
    const tag=document.activeElement?.tagName?.toLowerCase();
    if(tag==='input'||tag==='textarea'||document.activeElement?.isContentEditable)return;
    if(e.key==='Escape') setState({currentLine:[],isDrawerOpen:true,isEraserMode:false,isCreatorOpen:false});
    if(e.key==='Backspace') setState({currentLine:state.currentLine.slice(0,-1)});
    if(e.key==='Enter') finishLine();
});

renderDOM();
toggleTab('SETUP');
